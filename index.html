<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기린마을</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<!-- 지도: Leaflet (OpenStreetMap, 무료/키 불필요) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- 로그인 + 데이터베이스: Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --ink: #111418;
    --muted: #6b7078;
    --faint: #b4b8c0;
    --accent: #E55A4C;
    --accent-dark: #B83D2F;
    --accent-soft: #FCEDEA;
    --danger: #c0392b;
    --danger-soft: #fbecea;
    --line: #ececec;
    --line-strong: #d8d8d8;
    --shadow-sm: 0 1px 2px rgba(20,24,30,.05);
    --shadow: 0 6px 24px rgba(20,24,30,.10);
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; }

  /* ===== 상단 바 ===== */
  header {
    background: rgba(255,255,255,.85);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 26px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 1200;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex: 1; }
  .brand .mark { font-size: 20px; }
  .brand h1 {
    font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -.02em;
  }
  .brand .sub { font-size: 13px; color: var(--muted); font-weight: 400; }

  #authArea { display: flex; align-items: center; gap: 10px; }
  .who-btn {
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 7px 13px; border-radius: 10px;
    border: 1px solid var(--line-strong); background: #fff; color: var(--ink);
    cursor: pointer; transition: all .12s;
  }
  .who-btn:hover { border-color: var(--ink); }
  /* 헤더의 ＋ 장소 추가 버튼을 닉네임 버튼과 크기 맞춤 */
  header #addBtn { font-size: 13px; padding: 7px 13px; border-radius: 10px; border: 1px solid var(--accent); }

  .btn {
    font-size: 14px; font-weight: 500; border: none; border-radius: 10px;
    padding: 10px 16px; cursor: pointer; transition: all .15s ease;
    letter-spacing: -.01em;
  }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-soft { background: #f1f1f1; color: var(--ink); }
  .btn-soft:hover { background: #e6e6e6; }
  .btn-block { width: 100%; }

  /* ===== 레이아웃 ===== */
  .layout { display: flex; height: calc(100vh - 59px); }

  .sidebar {
    width: 360px; min-width: 360px; background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .search-wrap { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .search-input { position: relative; }
  .search-input input {
    width: 100%; font-family: inherit; font-size: 14px;
    padding: 11px 14px 11px 38px; border: 1px solid var(--line-strong);
    border-radius: 10px; background: #fafafa; color: var(--ink);
  }
  .search-input input::placeholder { color: var(--faint); }
  .search-input input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .search-input .ic { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 15px; }

  .filters { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; align-items: center; }
  .locate-btn {
    font-size: 13px; font-weight: 500; padding: 7px 13px;
    border: 1px solid var(--line-strong); border-radius: 10px;
    background: #fff; cursor: pointer; color: var(--ink); transition: all .12s;
    font-family: inherit; flex-shrink: 0;
  }
  .locate-btn:hover { border-color: var(--ink); }
  .chip { flex-shrink: 0; }

  .cat-popover {
    position: absolute; z-index: 1800; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 132px; display: none;
  }
  .cat-popover.open { display: block; }
  .cat-popover button {
    display: block; width: 100%; text-align: left; border: none; background: none;
    padding: 9px 12px; font-size: 14px; color: var(--ink); border-radius: 6px;
    cursor: pointer; font-family: inherit;
  }
  .cat-popover button:hover { background: #f4f4f4; }
  .cat-popover button.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 500; }

  /* 길찾기 버튼 */
  .nav-bar { margin-top: 12px; }
  .nav-btn {
    width: 100%; border: 1px solid var(--ink); background: var(--ink); color: #fff;
    border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
  }
  .nav-btn:hover { background: #2a2f37; }
  .popup-detail .nav-btn { padding: 7px 10px; font-size: 12.5px; border-radius: 8px; }
  .chip {
    font-size: 13px; font-weight: 500; padding: 7px 13px;
    border: 1px solid var(--line-strong); border-radius: 10px;
    background: #fff; cursor: pointer; color: var(--muted); transition: all .12s;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--faint); }
  .chip.active { background: #fff; border-color: var(--accent); color: var(--accent-dark); }

  .list-head {
    padding: 14px 20px 6px; font-size: 12px; font-weight: 500;
    color: var(--faint); letter-spacing: .04em; text-transform: uppercase;
  }
  .list { flex: 1; overflow-y: auto; padding: 0; }

  .place {
    position: relative;
    padding: 16px 44px 16px 18px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .12s;
  }
  .place:last-child { border-bottom: none; }
  .kebab {
    position: absolute; top: 10px; right: 8px; width: 30px; height: 30px;
    border: none; background: none; border-radius: 8px; cursor: pointer;
    color: var(--faint); font-size: 18px; line-height: 1;
  }
  .kebab:hover { background: #ececec; color: var(--ink); }

  .kebab-menu {
    position: fixed; z-index: 2500; background: #fff; border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 132px; display: none;
  }
  .kebab-menu.show { display: block; }
  .kebab-menu button {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    border: none; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .kebab-menu button:hover { background: #f4f4f4; }
  .kebab-menu button.danger { color: var(--danger); }
  .kebab-menu button.danger:hover { background: var(--danger-soft); }
  .place:hover { background: #f7f7f7; }
  .place.selected { background: var(--accent-soft); }
  .place .top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .place .name { font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
  .place .cat-dot {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px;
    background: #f1f1f1; color: var(--muted); flex-shrink: 0;
  }
  .place .addr { font-size: 12.5px; color: var(--muted); margin: 0 0 9px; }
  .place .count { font-size: 12px; color: var(--muted); margin-top: 8px; text-align: right; margin-right: -28px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11.5px; font-weight: 500; background: #f3f3f3; color: #6b7078;
    padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  }
  .tag-more { background: #e6e6e6; color: var(--muted); }
  .tags-clamp { flex-wrap: wrap; }

  /* 좋아요/싫어요 */
  .react-bar { display: flex; gap: 6px; margin-top: 12px; justify-content: flex-end; }
  .leaflet-popup-content .react-bar { margin-right: -10px; }
  .detail-card .react-bar { margin-right: -6px; }
  .react-btn {
    border: 1px solid var(--line-strong); background: #fff; border-radius: 8px;
    padding: 4px 9px; cursor: pointer; font-size: 12px; color: var(--muted); transition: all .12s;
    line-height: 1.4;
  }
  .react-btn b { color: var(--ink); }
  .react-btn:hover { border-color: var(--faint); }
  .react-btn.on-like { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }
  .react-btn.on-like b { color: var(--accent-dark); }
  .react-btn.on-dislike { border-color: var(--ink); background: #f1f1f1; color: var(--ink); }
  .react-btn.on-dislike b { color: var(--ink); }
  .reasons { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .reasons-h { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .reason { font-size: 13px; color: #5b6573; font-style: italic; margin: 3px 0; }

  /* 사진 */
  .photos { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
  .photos .photo {
    height: 84px; width: auto; max-width: 140px; object-fit: cover;
    border-radius: 8px; flex-shrink: 0; border: 1px solid var(--line); cursor: zoom-in;
  }

  /* 사진 라이트박스 */
  .lightbox {
    position: fixed; inset: 0; background: rgba(15,18,24,.85);
    display: none; align-items: center; justify-content: center; z-index: 3000;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: var(--shadow); }
  .lightbox .lb-close {
    position: absolute; top: 16px; right: 18px; width: 40px; height: 40px;
    border: none; background: rgba(255,255,255,.15); color: #fff; font-size: 22px;
    border-radius: 50%; cursor: pointer; line-height: 1;
  }
  .lightbox .lb-close:hover { background: rgba(255,255,255,.28); }
  .lightbox .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    border: none; background: rgba(255,255,255,.15); color: #fff;
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 22px; line-height: 1;
  }
  .lightbox .lb-nav:hover { background: rgba(255,255,255,.28); }
  .lightbox .lb-prev { left: 18px; }
  .lightbox .lb-next { right: 18px; }
  .lightbox .lb-count { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 13px; background: rgba(0,0,0,.4); padding: 4px 10px; border-radius: 999px; }
  /* 목록 썸네일 — 같은 줄 왼쪽, 클릭 불가 */
  .place-row { display: block; }
  .place-thumbs { display: flex; gap: 6px; margin-top: 10px; }
  .place-thumbs .place-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); flex-shrink: 0; }
  .place-thumbs .place-thumb-more {
    width: 60px; height: 60px; border-radius: 8px; border: 1px solid var(--line);
    background: #f3f3f3; color: var(--muted); display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 500; flex-shrink: 0;
  }
  .place-body { min-width: 0; }
  .photo-edit { display: flex; flex-wrap: wrap; gap: 8px; }
  .photo-edit:empty { display: none; }
  .pthumb { position: relative; width: 70px; height: 70px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); flex-shrink: 0; }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; }
  .pthumb.uploading { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); background: #fafafa; }
  .pthumb-x {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border: none;
    border-radius: 50%; background: rgba(20,24,30,.6); color: #fff; cursor: pointer; font-size: 13px; line-height: 1;
  }

  .empty { padding: 54px 26px; text-align: center; color: var(--muted); }
  .empty .big { font-size: 34px; margin-bottom: 12px; opacity: .5; }
  .empty b { color: var(--ink); }

  /* 지도 — 부모를 꽉 채우도록 absolute 처리 (높이 0 버그 방지) */
  .map-col { flex: 1; position: relative; }
  #map { position: absolute; inset: 0; background: #eaeaea; }

  /* 모바일 상세 화면 (PC에서는 숨김) */
  .mobile-detail-bar {
    display: none; position: absolute; top: 0; left: 0; right: 0; z-index: 1700;
    background: rgba(255,255,255,.95); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 11px 14px; align-items: center; gap: 10px;
  }
  .mobile-detail-bar button {
    background: #f1f1f1; border: none; border-radius: 9px; width: 38px; height: 38px;
    font-size: 19px; cursor: pointer; flex-shrink: 0; color: var(--ink);
  }
  .mobile-detail-bar .t { font-weight: 700; font-size: 15px; letter-spacing: -.01em; }

  .detail-card {
    display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 1700;
    background: #fff; border-top-left-radius: 20px; border-top-right-radius: 20px;
    box-shadow: 0 -6px 24px rgba(28,32,40,.14); padding: 18px 20px 26px;
    max-height: 60%; overflow-y: auto;
  }
  .detail-card .dc-name { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .detail-card .dc-addr { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .detail-card .dc-note { font-size: 13.5px; color: #5b6573; font-style: italic; margin: 12px 0 0; }
  .detail-card .dc-grip { width: 38px; height: 4px; border-radius: 99px; background: var(--line-strong); margin: -6px auto 14px; }

  /* ===== 모달 ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,24,30,.45);
    display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 18px; width: 100%; max-width: 500px;
    max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow);
  }
  .modal.narrow { max-width: 400px; }
  .modal-head {
    padding: 20px 24px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  }
  .modal-head .close-x { margin-top: -2px; }
  .modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .modal-head .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .modal-body { padding: 4px 24px 8px; }
  .field { margin-bottom: 18px; }
  .field > label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 13.5px; }
  .field .hint { font-weight: 400; color: var(--faint); }
  .field .req { font-weight: 500; color: var(--accent); font-size: 12.5px; margin-left: 2px; }
  .field input[type=text], .field input[type=email], .field input[type=password], .field textarea {
    width: 100%; font-family: inherit; font-size: 14px;
    padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fafafa;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .field textarea { resize: vertical; min-height: 64px; line-height: 1.5; }

  .seg { display: flex; gap: 8px; }
  .seg label {
    flex: 1; text-align: center; border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 10px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--muted); transition: all .12s;
  }
  .seg input { display: none; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }

  .tag-pick { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-pick label {
    border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 13px;
    cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); transition: all .12s;
  }
  .tag-pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }
  .tag-pick input { display: none; }

  /* 검색 영역 */
  .search-row { display: flex; gap: 8px; }
  .search-row input { flex: 1; }
  .search-results { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: none; }
  .search-results.show { display: block; }
  .sr-item { padding: 10px 13px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background .1s; }
  .sr-item:last-child { border-bottom: none; }
  .sr-item:hover { background: #f5f5f5; }
  .sr-item .sr-name { font-weight: 500; font-size: 14px; }
  .sr-item .sr-addr { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .sr-msg { padding: 12px 13px; font-size: 13px; color: var(--muted); }

  .or-divider {
    display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; color: var(--faint); font-size: 12px;
  }
  .or-divider::before, .or-divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .loc-status {
    background: #fafafa; border: 1px dashed var(--line-strong); border-radius: 10px;
    padding: 11px 13px; font-size: 13px; color: var(--muted);
  }
  .loc-status.set { background: var(--accent-soft); border-style: solid; border-color: #f3d7d2; color: var(--accent-dark); font-weight: 500; }

  .auth-msg { font-size: 13px; min-height: 18px; color: var(--danger); margin-top: -6px; }
  .link-btn { background: none !important; color: var(--accent); box-shadow: none; }

  .modal-foot { padding: 16px 24px 22px; display: flex; gap: 10px; }
  .modal-foot.col { flex-direction: column; }
  .modal-foot.end { justify-content: flex-end; }
  .modal-foot .btn { white-space: nowrap; }
  .modal-foot .btn-soft { flex-shrink: 0; }
  .modal-foot .btn-block { flex: 1; width: auto; }
  .modal-foot.end .btn { font-size: 13px; padding: 8px 14px; }
  .close-x { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--faint); line-height: 1; }
  .close-x:hover { color: var(--ink); }

  .map-hint {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px;
    font-size: 13px; font-weight: 500; z-index: 1500; box-shadow: var(--shadow); display: none;
  }
  .map-hint.show { display: block; }

  .popup-detail { min-width: 200px; }
  .popup-detail .name { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .popup-detail .desc { font-size: 13px; color: var(--muted); margin: 7px 0; font-style: italic; }
  .leaflet-popup-content { margin: 14px 16px; }

  @media (max-width: 760px) {
    .layout { display: block; }
    .sidebar { width: 100%; min-width: 0; height: 100%; border-right: none; }
    .map-col { display: none; }
    .filters {
      flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
      margin: 12px -18px 0; padding: 0 18px;
    }
    .filters::-webkit-scrollbar { display: none; }
    body.mobile-detail .map-col,
    body.mobile-pick .map-col,
    body.mobile-locate .map-col { display: block; position: fixed; inset: 0; z-index: 1600; }
    body.mobile-detail .mobile-detail-bar,
    body.mobile-locate .mobile-detail-bar { display: flex; }
    body.mobile-detail .detail-card { display: block; }
    .brand .sub { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">🦒</span>
    <h1>기린마을</h1>
  </div>
  <div id="authArea"></div>
  <button class="btn btn-primary" id="addBtn">＋ 장소 추가</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="search-wrap">
      <div class="search-input">
        <span class="ic">🔍</span>
        <input type="text" id="search" placeholder="가게 이름이나 동네로 찾기" />
      </div>
      <div class="filters">
        <button class="locate-btn" id="locateBtn">📍 내 주변</button>
        <button class="chip active" data-cat="all">전체</button>
        <button class="chip" id="catChip" data-cat="cat">카테고리 ▾</button>
        <button class="chip" id="favChip" data-cat="fav" style="display:none">👍 좋아요</button>
        <button class="chip" id="mineChip" data-cat="mine" style="display:none">📝 내가 등록</button>

<script>
/* =========================================================
   기린마을 — 발달장애인 친화 식당·카페 가이드
   로그인 + 데이터: Supabase. 좋아요=즐겨찾기, 싫어요엔 이유.
   ========================================================= */

const SUPABASE_URL = 'https://eqpmxsikzluywowsxcut.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVxcG14c2lremx1eXdvd3N4Y3V0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNzAxNzcsImV4cCI6MjA5Nzc0NjE3N30.bAnH1XFEQR3U_6vD3exsTiJ6R4qOmwh1EPTGqWn8Ypw';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const TAGS = [
  "휠체어 접근 가능", "조용한 공간", "그림·사진 메뉴판", "직원이 친절해요",
  "넓고 단순한 동선", "자극이 적은 조명", "장애인 화장실", "주차 편리",
];
const TAG_ICONS = {
  "휠체어 접근 가능": "♿",
  "조용한 공간": "🤫",
  "그림·사진 메뉴판": "🖼️",
  "직원이 친절해요": "🤗",
  "넓고 단순한 동선": "🚶",
  "자극이 적은 조명": "🌙",
  "장애인 화장실": "🚻",
  "주차 편리": "🚗",
};
const tagDisplay = t => (TAG_ICONS[t] ? TAG_ICONS[t] + ' ' : '') + t;

let places = [];
let reactions = [];
let currentUser = null;

/* ---------- 지도 ---------- */
const map = L.map('map', { zoomControl: true }).setView([37.5665, 126.9780], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);
setTimeout(() => map.invalidateSize(), 200);

let markers = {};
let pickingLocation = false;
let pickedLatLng = null;
let tempMarker = null;

const catLabel = c => c === 'cafe' ? '☕ 카페' : '🍚 식당';

/* ---------- 데이터 불러오기 ---------- */
async function loadAll() {
  const { data: pl } = await sb.from('places').select('*').order('created_at', { ascending: true });
  places = pl || [];
  const { data: rx } = await sb.from('reactions').select('*');
  reactions = rx || [];
  renderList();
  refreshOpenDetail();
}

function reactionInfo(placeId) {
  const rs = reactions.filter(r => r.place_id === placeId);
  const likes = rs.filter(r => r.type === 'like').length;
  const dislikes = rs.filter(r => r.type === 'dislike').length;
  const mine = currentUser ? rs.find(r => r.user_id === currentUser.id) : null;
  const reasons = rs.filter(r => r.type === 'dislike' && r.reason).map(r => r.reason);
  return { likes, dislikes, mine, reasons };
}

/* ---------- 공용 조각: 좋아요/싫어요 바, 아쉬운 점 ---------- */
function reactionBarHtml(p) {
  const info = reactionInfo(p.id);
  const likeOn = info.mine && info.mine.type === 'like';
  const disOn = info.mine && info.mine.type === 'dislike';
  return `<div class="react-bar">
    <button class="react-btn ${likeOn ? 'on-like' : ''}" onclick="window.react('${p.id}','like')">👍 <b>${info.likes}</b></button>
    <button class="react-btn ${disOn ? 'on-dislike' : ''}" onclick="window.onDislike('${p.id}')">👎 <b>${info.dislikes}</b></button>
  </div>`;
}
function reasonsHtml(p) {
  const info = reactionInfo(p.id);
  if (!info.reasons.length) return '';
  return `<div class="reasons"><div class="reasons-h">이런 점이 아쉬웠대요</div>${
    info.reasons.map(r => `<p class="reason">“${escapeHtml(r)}”</p>`).join('')}</div>`;
}
function photosHtml(p, cls) {
  if (!p.photos || !p.photos.length) return '';
  return `<div class="photos ${cls || ''}">${p.photos.map(u =>
    `<img src="${escapeHtml(u)}" class="photo" alt="가게 사진">`).join('')}</div>`;
}
function navBtnHtml(p) {
  return `<div class="nav-bar"><button class="nav-btn" onclick="window.openDirections('${p.id}')">🧭 네이버 지도로 길찾기</button></div>`;
}

/* ---------- 지도 마커 ---------- */
function renderMarkers(filtered) {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  filtered.forEach(p => {
    const m = L.marker([p.lat, p.lng]).addTo(map);
    const tagsHtml = (p.tags || []).map(t => `<span class="tag">${escapeHtml(tagDisplay(t))}</span>`).join(' ');
    m.bindPopup(`
      <div class="popup-detail">
        <p class="name">${escapeHtml(p.name)}</p>
        <div style="font-size:13px;color:#8b909a">${catLabel(p.category)}${p.address ? ' · ' + escapeHtml(p.address) : ''}</div>
        ${p.note ? `<p class="desc">“${escapeHtml(p.note)}”</p>` : ''}
        <div class="tags">${tagsHtml}</div>
        ${photosHtml(p)}
        ${reactionBarHtml(p)}
        ${reasonsHtml(p)}
        ${navBtnHtml(p)}
      </div>`);
    m.on('click', () => selectPlace(p.id, false));
    markers[p.id] = m;
  });
}

/* ---------- 목록/필터 ---------- */
let activeCat = 'all', searchText = '', selectedId = null;

function getFiltered() {
  return places.filter(p => {
    if (activeCat === 'fav') {
      const info = reactionInfo(p.id);
      if (!(info.mine && info.mine.type === 'like')) return false;
    } else if (activeCat === 'mine') {
      if (!currentUser || p.created_by !== currentUser.id) return false;
    } else if ((activeCat === 'restaurant' || activeCat === 'cafe') && p.category !== activeCat) {
      return false;
    }
    if (searchText) {
      const hay = (p.name + ' ' + (p.address || '') + ' ' + (p.tags || []).join(' ')).toLowerCase();
      if (!hay.includes(searchText.toLowerCase())) return false;
    }
    return true;
  });
}

function renderList() {
  const filtered = getFiltered();
  const headLabel = activeCat === 'fav'  ? '내 좋아요 · '
                  : activeCat === 'mine' ? '내가 등록한 장소 · '
                  : activeCat === 'restaurant' ? '식당 · '
                  : activeCat === 'cafe' ? '카페 · '
                  : '등록된 장소 · ';
  document.getElementById('listHead').textContent = headLabel + filtered.length + '곳';
  const listEl = document.getElementById('list');

  if (filtered.length === 0) {
    const msg = activeCat === 'fav'
      ? '아직 좋아요한 장소가 없어요.<br>마음에 드는 곳에 👍를 눌러보세요.'
      : '아직 등록된 장소가 없어요.<br>위 <b>＋ 장소 추가</b>로 첫 장소를 올려보세요.';
    listEl.innerHTML = `<div class="empty"><div class="big">📍</div>${msg}</div>`;
  } else {
    listEl.innerHTML = filtered.map(p => {
      const info = reactionInfo(p.id);
      const tagsHtml = (p.tags || []).map(t => `<span class="tag">${escapeHtml(tagDisplay(t))}</span>`).join('');
      const own = currentUser && p.created_by === currentUser.id;
      const allPhotos = p.photos || [];
      const shown = allPhotos.slice(0, 3);
      const extra = allPhotos.length - shown.length;
      const thumbs = shown.length
        ? `<div class="place-thumbs">${
            shown.map(u => `<img class="place-thumb" src="${escapeHtml(u)}" alt="">`).join('')}${
            extra > 0 ? `<div class="place-thumb-more">+${extra}</div>` : ''}</div>`
        : '';
      return `<div class="place ${p.id === selectedId ? 'selected' : ''}" data-id="${p.id}">
        ${own ? `<button class="kebab" data-id="${p.id}" aria-label="수정·삭제 메뉴">⋯</button>` : ''}
        <div class="top">
          <span class="cat-dot ${p.category === 'cafe' ? 'cafe' : ''}">${p.category === 'cafe' ? '카페' : '식당'}</span>
          <span class="name">${escapeHtml(p.name)}</span>
        </div>
        ${p.address ? `<p class="addr">${escapeHtml(shortAddress(p.address))}</p>` : ''}
        <div class="tags tags-clamp">${tagsHtml}</div>
        ${thumbs}
        <div class="count">👍 ${info.likes} · 👎 ${info.dislikes}</div>
      </div>`;
    }).join('');
    listEl.querySelectorAll('.place').forEach(el =>
      el.addEventListener('click', () => selectPlace(el.dataset.id, true)));
    listEl.querySelectorAll('.kebab').forEach(btn =>
      btn.addEventListener('click', e => { e.stopPropagation(); openKebab(btn.dataset.id, btn); }));
    listEl.querySelectorAll('.tags-clamp').forEach(clampTags);
  }
  renderMarkers(filtered);
}

/* 태그를 한 줄로 고정하고, 넘치면 +N 으로 표시 */
function clampTags(container) {
  const chips = [...container.querySelectorAll('.tag:not(.tag-more)')];
  const old = container.querySelector('.tag-more'); if (old) old.remove();
  chips.forEach(c => c.style.display = '');
  if (chips.length === 0) return;
  const firstTop = chips[0].offsetTop;
  const firstRow = chips.filter(c => c.offsetTop === firstTop);
  if (firstRow.length === chips.length) return;            // 다 한 줄에 들어감
  let hidden = chips.length - firstRow.length;
  chips.slice(firstRow.length).forEach(c => c.style.display = 'none');
  const more = document.createElement('span');
  more.className = 'tag tag-more';
  more.textContent = '+' + hidden;
  container.appendChild(more);
  while (more.offsetTop > firstTop && firstRow.length > 1) {  // +N 칩이 넘치면 줄여감
    firstRow.pop().style.display = 'none';
    hidden++; more.textContent = '+' + hidden;
  }
}
let _clampTimer;
window.addEventListener('resize', () => {
  clearTimeout(_clampTimer);
  _clampTimer = setTimeout(() => document.querySelectorAll('#list .tags-clamp').forEach(clampTags), 150);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => document.querySelectorAll('#list .tags-clamp').forEach(clampTags));
}

const isMobile = () => window.matchMedia('(max-width: 760px)').matches;

function selectPlace(id, fromList) {
  selectedId = id;
  const p = places.find(x => x.id === id);
  if (!p) return;
  renderList();
  if (fromList && isMobile()) {
    openDetail(p);
  } else if (fromList) {
    map.setView([p.lat, p.lng], 16);
    if (markers[id]) markers[id].openPopup();
  }
}

/* ---------- 모바일 상세 화면 ---------- */
function detailHtml(p) {
  const tags = (p.tags || []).map(t => `<span class="tag">${escapeHtml(tagDisplay(t))}</span>`).join(' ');
  return `<div class="dc-grip"></div>
    <div class="top">
      <span class="cat-dot ${p.category === 'cafe' ? 'cafe' : ''}">${p.category === 'cafe' ? '카페' : '식당'}</span>
      <span class="dc-name">${escapeHtml(p.name)}</span>
    </div>
    ${p.address ? `<p class="dc-addr">${escapeHtml(p.address)}</p>` : ''}
    <div class="tags" style="margin-top:12px">${tags || '<span class="tag" style="background:none;color:#b4b8c0">등록된 정보가 없어요</span>'}</div>
    ${p.note ? `<p class="dc-note">“${escapeHtml(p.note)}”</p>` : ''}
    ${photosHtml(p)}
    ${reactionBarHtml(p)}
    ${reasonsHtml(p)}
    ${navBtnHtml(p)}`;
}

function openDetail(p) {
  document.getElementById('detailTitle').textContent = p.name;
  document.getElementById('detailCard').innerHTML = detailHtml(p);
  document.body.classList.add('mobile-detail');
  map.closePopup();
  setTimeout(() => { map.invalidateSize(); map.setView([p.lat, p.lng], 16); }, 60);
}
function closeDetail() { document.body.classList.remove('mobile-detail'); }
function refreshOpenDetail() {
  if (document.body.classList.contains('mobile-detail') && selectedId) {
    const p = places.find(x => x.id === selectedId);
    if (p) document.getElementById('detailCard').innerHTML = detailHtml(p);
  }
}
document.getElementById('backBtn').addEventListener('click', () => {
  closeDetail();
  document.body.classList.remove('mobile-locate');
});

/* ---------- 내 위치 보기 ---------- */
let myLocMarker = null;
function findMyLocation() {
  if (!navigator.geolocation) { alert('이 기기에선 위치 기능을 쓸 수 없어요.'); return; }
  if (isMobile()) {
    document.body.classList.add('mobile-locate');
    document.getElementById('detailTitle').textContent = '내 주변';
    setTimeout(() => map.invalidateSize(), 60);
  }
  const btn = document.getElementById('locateBtn');
  const orig = btn.textContent; btn.textContent = '위치 찾는 중…'; btn.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    map.setView([lat, lng], 15);
    if (myLocMarker) map.removeLayer(myLocMarker);
    myLocMarker = L.circleMarker([lat, lng], {
      radius: 9, color: '#E55A4C', weight: 3, fillColor: '#E55A4C', fillOpacity: .35
    }).bindPopup('📍 내 위치 근처').addTo(map);
    btn.textContent = orig; btn.disabled = false;
  }, err => {
    const msg = err.code === 1 ? '위치 권한이 거부됐어요. 브라우저 주소창 옆 자물쇠에서 권한을 허용해 주세요.'
              : err.code === 2 ? '위치를 찾을 수 없어요. 잠시 후 다시 시도해 주세요.'

async function doAuth() {
  const email = document.getElementById('a-email').value.trim();
  const pass = document.getElementById('a-pass').value;
  const msg = document.getElementById('authMsg');
  msg.style.color = 'var(--danger)';
  if (!email || !pass) { msg.textContent = '이메일과 비밀번호를 입력해 주세요.'; return; }
  const btn = document.getElementById('authSubmit'); btn.disabled = true;
  try {
    if (authMode === 'signup') {
      const nickname = document.getElementById('a-nick').value.trim() || email.split('@')[0];
      const { error } = await sb.auth.signUp({ email, password: pass, options: { data: { nickname } } });
      if (error) { msg.textContent = translateAuthError(error.message); return; }
      const { error: e2 } = await sb.auth.signInWithPassword({ email, password: pass });
      if (e2) {
        authMode = 'login'; renderAuthMode();
        msg.style.color = 'var(--accent)';
        msg.textContent = '가입은 됐어요! 받은 메일의 인증 링크를 누른 뒤 로그인해 주세요.';
        return;
      }
      closeAuth();
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { msg.textContent = translateAuthError(error.message); return; }
      closeAuth();
    }
  } finally { btn.disabled = false; }
}
function translateAuthError(m) {
  if (/Invalid login/i.test(m)) return '이메일 또는 비밀번호가 맞지 않아요.';
  if (/already registered|already been|User already/i.test(m)) return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if (/Password should be at least/i.test(m)) return '비밀번호는 6자 이상이어야 해요.';
  if (/valid email|invalid email|email.*invalid|is invalid/i.test(m)) return '이메일 형식을 확인해 주세요. (일부 도메인은 막혀 있어요)';
  if (/Email not confirmed/i.test(m)) return '이메일 인증이 아직 안 됐어요. 받은 메일의 링크를 눌러주세요.';
  return m;
}

function resizeImage(file, maxW) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxW) { height = Math.round(height * maxW / width); width = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('변환 실패')), 'image/jpeg', 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('이미지를 읽을 수 없어요')); };
    img.src = url;
  });
}

async function uploadPhoto(file) {
  const blob = await resizeImage(file, 1280);
  const path = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
  const { error } = await sb.storage.from('place-photos').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return sb.storage.from('place-photos').getPublicUrl(path).data.publicUrl;
}

/* ---------- 가게 검색 (OpenStreetMap Nominatim) ---------- */
const searchInput = document.getElementById('f-search');
const searchResults = document.getElementById('searchResults');

async function geocode(q) {
  const url = 'https://nominatim.openstreetmap.org/search'
    + '?format=jsonv2&addressdetails=1&limit=6&countrycodes=kr&accept-language=ko'
    + '&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
  if (!res.ok) throw new Error('검색 실패');
  return res.json();
}
function showSearchMsg(msg) {
  searchResults.innerHTML = `<div class="sr-msg">${escapeHtml(msg)}</div>`;
  searchResults.classList.add('show');
}
async function runSearch() {
  const q = searchInput.value.trim();
  if (!q) { searchResults.classList.remove('show'); return; }
  showSearchMsg('검색 중…');
  try {
    const results = await geocode(q);
    if (!results.length) { showSearchMsg('검색 결과가 없어요. 다른 이름이나 주소로 찾아보세요.'); return; }
    searchResults.innerHTML = results.map((r, i) => {
      const main = r.name && r.name.trim() ? r.name : r.display_name.split(',')[0];
      return `<div class="sr-item" data-i="${i}">
        <div class="sr-name">${escapeHtml(main)}</div>
        <div class="sr-addr">${escapeHtml(r.display_name)}</div>
      </div>`;
    }).join('');
    searchResults.classList.add('show');
    searchResults.querySelectorAll('.sr-item').forEach(el => {
      el.addEventListener('click', () => pickSearchResult(results[Number(el.dataset.i)]));
    });
  } catch (err) {
    showSearchMsg('검색 중 문제가 생겼어요. 잠시 후 다시 시도해 주세요.');
  }
}
function pickSearchResult(r) {
  const main = r.name && r.name.trim() ? r.name : r.display_name.split(',')[0];
  if (!document.getElementById('f-name').value.trim()) document.getElementById('f-name').value = main;
  document.getElementById('f-addr').value = r.display_name;
  pickedLatLng = { lat: parseFloat(r.lat), lng: parseFloat(r.lon) };
  searchResults.classList.remove('show');
  setLocStatus();
  if (tempMarker) map.removeLayer(tempMarker);
  tempMarker = L.marker([pickedLatLng.lat, pickedLatLng.lng]).addTo(map);
  map.setView([pickedLatLng.lat, pickedLatLng.lng], 16);
}

  } catch (e) {
    alert('저장 중 문제가 생겼어요: ' + (e.message || ''));
  } finally { saveBtn.disabled = false; }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* 목록용 주소 요약: "시 구 동"까지만. 직접 입력한 짧은 주소는 그대로. */
function shortAddress(addr) {
  if (!addr) return '';
  if (!addr.includes(',')) return addr;
  const tokens = addr.split(',').map(s => s.trim()).filter(Boolean);
  // 우선순위: 광역시/특별시 → 일반 시 → 도 (4단 주소에선 구가 속한 '시'가 더 자연스러움)
  const sidoRaw = tokens.find(t => /(특별시|광역시|특별자치시)$/.test(t))
               || tokens.find(t => /시$/.test(t) && t.length > 1 && !/(특별시|광역시|특별자치시)$/.test(t))
               || tokens.find(t => /(도|특별자치도)$/.test(t) && t.length > 1);
  const gugun = tokens.find(t => /(구|군)$/.test(t) && t.length > 1);
  const dong  = tokens.find(t => /동$/.test(t) && t.length > 1)
             || tokens.find(t => /가$/.test(t) && t.length > 1)
             || tokens.find(t => /(리|면|읍)$/.test(t) && t.length > 1);
  const si = sidoRaw ? sidoRaw.replace(/(특별시|광역시|특별자치시)$/, '') : '';
  const parts = [si, gugun, dong].filter(Boolean);
  return parts.length >= 2 ? parts.join(' ') : addr;
}

/* ---------- 사진 확대 (라이트박스) ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCount = document.getElementById('lbCount');
let lbGroup = [], lbIndex = 0;

function openLightbox(srcGroup, startSrc) {
  lbGroup = srcGroup;
  lbIndex = Math.max(0, srcGroup.indexOf(startSrc));
  renderLightbox();
  lightbox.classList.add('open');
}
function closeLightbox() { lightbox.classList.remove('open'); }
function renderLightbox() {
  lbImg.src = lbGroup[lbIndex] || '';
  const many = lbGroup.length > 1;
  document.getElementById('lbPrev').style.display = many ? '' : 'none';
  document.getElementById('lbNext').style.display = many ? '' : 'none';
  lbCount.style.display = many ? '' : 'none';
  lbCount.textContent = many ? `${lbIndex+1} / ${lbGroup.length}` : '';
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); lbIndex = (lbIndex - 1 + lbGroup.length) % lbGroup.length; renderLightbox(); });
document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); lbIndex = (lbIndex + 1) % lbGroup.length; renderLightbox(); });
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft' && lbGroup.length > 1) { lbIndex = (lbIndex - 1 + lbGroup.length) % lbGroup.length; renderLightbox(); }
  else if (e.key === 'ArrowRight' && lbGroup.length > 1) { lbIndex = (lbIndex + 1) % lbGroup.length; renderLightbox(); }
});

/* 상세/말풍선의 사진 클릭 → 라이트박스. 목록의 .place-thumb는 제외 */
document.addEventListener('click', e => {
  const img = e.target.closest('.photos .photo');
  if (!img) return;
  const group = [...img.closest('.photos').querySelectorAll('.photo')].map(i => i.src);
  openLightbox(group, img.src);
});

/* ---------- 시작 + 로그인 상태 감지 ---------- */
sb.auth.onAuthStateChange((_event, session) => {
  currentUser = session ? session.user : null;
  renderAuthBar();
  loadAll();
});
(async () => {
  const { data } = await sb.auth.getSession();
  currentUser = data.session ? data.session.user : null;
  renderAuthBar();
  await loadAll();
})();
