<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>기린마을 · 잠시 공사 중</title>
<meta name="description" content="기린마을은 잠시 공사 중이에요. 곧 다시 만나요." />
<link rel="icon" type="image/png" href="logo.png" />
<link rel="apple-touch-icon" href="logo-512.png" />
<meta property="og:title" content="기린마을 · 잠시 공사 중" />
<meta property="og:description" content="새 기능을 준비하고 있어요. 곧 돌아올게요." />
<meta property="og:image" content="logo-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111418;
    --muted: #6b7078;
    --faint: #b4b8c0;
    --accent: #0F8A72;
    --accent-dark: #0B6B58;
    --accent-soft: #E1F1ED;
    --line: #ececec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff; color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.5;
  }
  .box { max-width: 420px; width: 100%; text-align: center; }
  .logo { width: 88px; height: auto; margin: 0 auto 20px; display: block; }
  .brand {
    font-size: 18px; font-weight: 700; letter-spacing: -.02em;
    color: var(--ink); margin-bottom: 36px;
  }
  .badge {
    display: inline-block; padding: 4px 12px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent-dark);
    font-size: 12px; font-weight: 500; margin-bottom: 18px;
  }
  h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -.02em;
    color: var(--ink); margin: 0 0 14px;
  }
  p { font-size: 15px; color: var(--muted); margin: 0 0 8px; }
  .contact {
    margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--muted);
  }
  .contact a { color: var(--accent-dark); text-decoration: none; }
  .contact a:hover { text-decoration: underline; }
  .contact .row { margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="box">
    <img src="logo.png" alt="기린마을" class="logo" />
    <div class="brand">기린마을</div>
    <div class="badge">🚧 공사 중</div>
    <h1>잠시 다녀오는 중이에요</h1>
    <p>새 기능을 준비하고 있어요.</p>
    <p>조금만 기다려 주세요.</p>
    <div class="contact">
      <div class="row">문의 · <a href="mailto:kirinmaeul@naver.com">kirinmaeul@naver.com</a></div>
      <div class="row"><a href="https://www.instagram.com/kirinmaeul" target="_blank" rel="noopener">인스타그램에서 소식 받기</a></div>
    </div>
  </div>
</body>
</html>
